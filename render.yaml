# Render 배포 설정.
#
# GitHub 저장소를 연결하면 이 파일을 읽어 웹 서비스와 DB를 만든다.
# 다른 플랫폼(Fly.io, Railway)을 쓰더라도 Dockerfile 과 환경변수는 같다.
services:
  - type: web
    name: pebble-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pebble-db
          property: connectionString
      # 공개 인터넷에 노출되므로 반드시 설정한다.
      # generateValue 로 Render 가 임의 문자열을 만들어 준다.
      - key: PEBBLE_DEVICE_TOKEN
        generateValue: true
      - key: PEBBLE_APP_TOKEN
        generateValue: true

databases:
  - name: pebble-db
    databaseName: pebble
    plan: free

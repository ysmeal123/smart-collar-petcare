# Render 배포 설정.
#
# GitHub 저장소를 연결하면 이 파일을 읽어 웹 서비스와 DB를 만든다.
# 다른 플랫폼(Fly.io, Railway)을 쓰더라도 Dockerfile 과 환경변수는 같다.
services:
  - type: web
    name: pebble-api
    runtime: docker
    # 명시하지 않으면 유료 플랜으로 만들어질 수 있다. 캡스톤에는 free 로 충분하다.
    # free 웹 서비스는 15분 놀면 잠들고 깨는 데 30~60초가 걸린다 (앱이 대응한다).
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pebble-db
          property: connectionString
      # 공개 인터넷에 노출되므로 반드시 설정한다.
      # generateValue 로 Render 가 임의 문자열을 만들어 준다.
      - key: PEBBLE_DEVICE_TOKEN
        generateValue: true
      - key: PEBBLE_APP_TOKEN
        generateValue: true

databases:
  - name: pebble-db
    databaseName: pebble
    plan: free
